# ==========================================================
# Environment
# ==========================================================

environment:
  env_name: simple_spread_v3
  num_agents: 3
  max_cycles: 25
  continuous_actions: false

  # null for training
  # human only for evaluation/play
  render_mode: null

# ==========================================================
# Networks
# ==========================================================

network:
  actor_hidden_dim: 128
  critic_hidden_dim: 128

# ==========================================================
# MAPPO
# ==========================================================

algorithm:
  gamma: 0.99
  gae_lambda: 0.95

  clip_ratio: 0.2

  learning_rate: 1.0e-4

  ppo_epochs: 10
  minibatch_size: 32

  entropy_coef: 0.02
  value_coef: 0.5

  max_grad_norm: 0.5

# ==========================================================
# Training
# ==========================================================

training:
  total_episodes: 30000
  rollout_length: 25

  seed: 42

  num_eval_episodes: 100

  resume_checkpoint: null

# ==========================================================
# Logging
# ==========================================================

logging:
  save_every: 5000
  eval_every: 500
  log_every: 10
  tensorboard: true
  debug: false